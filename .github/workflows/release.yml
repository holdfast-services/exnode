# Release exnode: static musl binaries for x86_64 and aarch64 Linux, built
# reproducibly from Cargo.lock with the toolchain in rust-toolchain.toml,
# checksummed, signed keylessly with Sigstore cosign, attested with SLSA build
# provenance and published to GitHub Releases with the packaging files and a
# stamped install.sh.
#
# Each release also carries one provider bundle per architecture, the same for
# every accelerator (NVIDIA, AMD, Tenstorrent; exnode never touches the GPU):
#   exnode-linux-x86_64.tar.gz   exnode-linux-aarch64.tar.gz
# Each extracts to exnode/ with the binary, the stamped install.sh, the
# systemd, sysusers and tmpfiles files, node.toml.example, README.txt,
# THIRD-PARTY-NOTICES.txt, and a SHA256SUMS over those with its own Sigstore
# bundle (SHA256SUMS.sigstore.json, signed by this workflow at the tag), which
# install.sh checks in bundle mode.  The release's SHA256SUMS covers the
# tarballs too, and each tarball has its own .sigstore.json like every asset.
#
# The asset names carry no version on purpose, so that
#   https://github.com/{repo}/releases/latest/download/exnode-linux-x86_64.tar.gz
# always fetches the newest release (GitHub's "latest" skips pre-releases).
# Keep them stable: the hub's install page and packaging/README.md link them.
#
# Every action is pinned to a full commit SHA (tag in the comment), resolved
# with `git ls-remote` on 2026-11-04.  zig and cargo-zigbuild come from PyPI
# by exact version and sha256 (scripts/zig-requirements.txt).  No caches: a
# release must not build from state a pull request could have written.
#
# Reproducible: each target is built twice, on two separate runners, by
# scripts/build-release.sh.  The sign job refuses to sign unless both builds
# are byte-identical.  A host can rebuild a tag with ex_release_rebuild
# (scripts/release-check.fish) and get the same SHA256SUMS lines.
#
# Jobs and their permissions:
#   build    contents: read                            compile one target, twice
#   sign     id-token: write, attestations: write      compare, cosign + provenance (no repo write)
#   publish  contents: write, environment "release"    create the release (no OIDC token)
#
# Tags with a suffix (v0.1.0-rc.1) publish as GitHub pre-releases, which
# /releases/latest and so install.sh's default never pick.
#
# Run on GitHub for v0.1.0-rc.1 and v0.1.0 (2026-11-25): both targets built
# byte-identical on separate runners and matched local builds; cosign v3
# bundles and the provenance attestation were made and verified.
# Not yet run on a runner: the bundle steps (packaging/bundle.sh and
# notices.py were run locally with scripts/dev.fish ex_bundle, unsigned).

name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: build (${{ matrix.target }}, ${{ matrix.builder }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
        builder: [a, b]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version

      - name: Tag matches the crate version
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "exnode") | .version')
          [ "v$crate" = "${GITHUB_REF_NAME%%-*}" ] || [ "v$crate" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::tag $GITHUB_REF_NAME does not match exnode $crate"; exit 1; }

      - name: Install zig and cargo-zigbuild (exact versions, hash-pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --no-deps --require-hashes --only-binary :all: \
            -r scripts/zig-requirements.txt
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"

      - name: Build (reproducible, static)
        run: |
          sh scripts/build-release.sh "$TARGET" dist
          file "dist/exnode-$TARGET"
          sha256sum "dist/exnode-$TARGET"
          if [ "$TARGET" = x86_64-unknown-linux-musl ]; then "dist/exnode-$TARGET" --version; fi

      - name: Third-party notices (from the crates this build just used)
        run: python3 -I packaging/notices.py "$TARGET" > "dist/THIRD-PARTY-NOTICES-$TARGET.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exnode-${{ matrix.target }}-${{ matrix.builder }}
          path: |
            dist/exnode-${{ matrix.target }}
            dist/THIRD-PARTY-NOTICES-${{ matrix.target }}.txt
          if-no-files-found: error
          retention-days: 3

  sign:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read      # checkout of the packaging files
      id-token: write     # Sigstore keyless signing and the provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: exnode-*-linux-musl-a
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: exnode-*-linux-musl-b
          path: rebuild
          merge-multiple: true

      - name: Both independent builds must be byte-identical
        run: |
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            a=$(sha256sum "dist/exnode-$t" | cut -d' ' -f1)
            b=$(sha256sum "rebuild/exnode-$t" | cut -d' ' -f1)
            echo "$t a=$a b=$b"
            [ "$a" = "$b" ] || { echo "::error::exnode-$t is not reproducible; not signing"; exit 1; }
          done
          rm -rf rebuild

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Assemble the release files, the bundles and SHA256SUMS
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cp packaging/systemd/exnode.service dist/exnode.service
          cp packaging/sysusers.d/exnode.conf dist/exnode.sysusers
          cp packaging/tmpfiles.d/exnode.conf dist/exnode.tmpfiles
          cp packaging/node.toml dist/node.toml
          # stamp only the two default lines; the script checks they were stamped
          sed -e "/^REPO=/s|@REPO@|$REPO|" -e "/^VERSION=/s|@VERSION@|$TAG|" scripts/install.sh > dist/install.sh
          grep -qx "REPO=\"\${EXNODE_REPO:-$REPO}\"" dist/install.sh
          grep -qx "VERSION=\"\${EXNODE_VERSION:-$TAG}\"" dist/install.sh
          chmod 0755 dist/exnode-*-linux-musl
          # one bundle per architecture: stage, sign its SHA256SUMS, pack
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct 2>/dev/null || echo 0)
          for arch in x86_64 aarch64; do
            target=$arch-unknown-linux-musl
            stage="$RUNNER_TEMP/bundle-$arch"
            sh packaging/bundle.sh stage "$stage" "dist/exnode-$target" dist/install.sh \
              "dist/THIRD-PARTY-NOTICES-$target.txt"
            cosign sign-blob --yes --bundle "$stage/exnode/SHA256SUMS.sigstore.json" "$stage/exnode/SHA256SUMS"
            sh packaging/bundle.sh pack "$stage" "dist/exnode-linux-$arch.tar.gz"
          done
          cd dist
          sha256sum exnode-x86_64-unknown-linux-musl exnode-aarch64-unknown-linux-musl \
            exnode.service exnode.sysusers exnode.tmpfiles node.toml install.sh \
            THIRD-PARTY-NOTICES-x86_64-unknown-linux-musl.txt THIRD-PARTY-NOTICES-aarch64-unknown-linux-musl.txt \
            exnode-linux-x86_64.tar.gz exnode-linux-aarch64.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Sign every file keylessly (one Sigstore bundle each)
        working-directory: dist
        run: |
          for f in *; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Verify the signature as install.sh will
        working-directory: dist
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
          sha256sum -c SHA256SUMS
          # each bundle as install.sh checks it in bundle mode
          for arch in x86_64 aarch64; do
            check="$RUNNER_TEMP/check-$arch"
            mkdir "$check" && tar -C "$check" -xzf "exnode-linux-$arch.tar.gz"
            cosign verify-blob --bundle "$check/exnode/SHA256SUMS.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$check/exnode/SHA256SUMS"
            (cd "$check/exnode" && sha256sum --strict -c SHA256SUMS)
            for f in exnode install.sh; do [ -x "$check/exnode/$f" ] || { echo "::error::$f is not executable in the $arch bundle"; exit 1; }; done
          done

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/exnode-x86_64-unknown-linux-musl
            dist/exnode-aarch64-unknown-linux-musl
            dist/exnode-linux-x86_64.tar.gz
            dist/exnode-linux-aarch64.tar.gz
            dist/install.sh
            dist/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: sign
    runs-on: ubuntu-24.04
    # Add a required reviewer to this environment (Settings, Environments) so a
    # pushed tag signs and attests but waits for a person before it publishes.
    environment: release
    permissions:
      contents: write     # create the GitHub Release and upload its assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          Install in three steps (use \`aarch64\` in place of \`x86_64\` on 64-bit ARM):

              curl -fsSLO https://github.com/$REPO/releases/latest/download/exnode-linux-x86_64.tar.gz && tar xzf exnode-linux-x86_64.tar.gz
              sudo ./exnode/install.sh
              # then answer the setup questions

          Or download \`install.sh\` alone, read it, then \`sudo sh install.sh\`. Do not pipe it into a shell.

          Verify by hand (cosign v3):

              cosign verify-blob --bundle SHA256SUMS.sigstore.json \\
                --certificate-identity https://github.com/$REPO/.github/workflows/release.yml@refs/tags/$TAG \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
              sha256sum -c --ignore-missing SHA256SUMS
              gh attestation verify exnode-x86_64-unknown-linux-musl --repo $REPO

          Rebuild it yourself (byte-identical): from a checkout,
          \`source scripts/release-check.fish; ex_release_rebuild $REPO $TAG\`.
          EOF
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --repo "$REPO" --verify-tag --title "exnode $TAG" \
            --notes-file notes.md $prerelease dist/*
