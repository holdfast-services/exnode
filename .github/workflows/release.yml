# Release exnode: static musl binaries for x86_64 and aarch64 Linux, built with
# a pinned toolchain from Cargo.lock, checksummed, signed keylessly with
# Sigstore cosign, attested with SLSA build provenance and published to GitHub
# Releases with the packaging files and a stamped install.sh.
#
# Every action is pinned to a full commit SHA (tag in the comment), resolved
# with `git ls-remote` on 2026-11-04.  zig and cargo-zigbuild come from PyPI
# by exact version and sha256.  No caches: a release must not build from state
# a pull request could have written.
#
# Jobs and their permissions:
#   build    contents: read                            compile one target
#   sign     id-token: write, attestations: write      cosign + provenance (no repo write)
#   publish  contents: write                           create the release (no OIDC token)
#
# Not verified offline (this workflow has not run yet):
#   - that zig 0.17.0 + cargo-zigbuild 0.24.1 link ring for aarch64-musl
#     (cargo-zigbuild's own CI tests zig 0.17.0)
#   - that python3 -m venv works on the ubuntu-24.04 runner image
#   - the inputs of actions at these SHAs (written against their documented
#     inputs; upload-artifact v7 / download-artifact v8 interoperate)
#   - attestations on a private repository need a plan that supports them
#   - cosign v3 writes and verifies the Sigstore bundle format with --bundle

name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Tag matches the crate version
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "exnode") | .version')
          [ "v$crate" = "${GITHUB_REF_NAME%%-*}" ] || [ "v$crate" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::tag $GITHUB_REF_NAME does not match exnode $crate"; exit 1; }

      - name: Install zig and cargo-zigbuild (exact versions, hash-pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          cat > "$RUNNER_TEMP/zig.txt" <<'EOF'
          ziglang==0.17.0 --hash=sha256:97079827064a7492cce5541ceb438ae8003ce1e54e399676da2d62fb7a5dc08b
          cargo-zigbuild==0.24.1 --hash=sha256:238a1ab54a95053a4eadc34775c81f795a8ad75f80bfed63f3f445f518102375
          EOF
          "$RUNNER_TEMP/zig/bin/pip" install --no-deps --require-hashes --only-binary :all: -r "$RUNNER_TEMP/zig.txt"
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"

      - name: Build
        run: cargo zigbuild --release --locked -p exnode --target "$TARGET"

      - name: Check the binary is static
        run: |
          bin="target/$TARGET/release/exnode"
          file "$bin"
          file "$bin" | grep -Eq 'statically linked|static-pie linked' \
            || { echo "::error::$bin is not statically linked"; exit 1; }
          if [ "$TARGET" = x86_64-unknown-linux-musl ]; then "$bin" --version; fi
          mkdir -p dist && cp "$bin" "dist/exnode-$TARGET"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exnode-${{ matrix.target }}
          path: dist/exnode-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 3

  sign:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read      # checkout of the packaging files
      id-token: write     # Sigstore keyless signing and the provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: exnode-*-linux-musl
          path: dist
          merge-multiple: true

      - name: Assemble the release files and SHA256SUMS
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cp packaging/systemd/exnode.service dist/exnode.service
          cp packaging/sysusers.d/exnode.conf dist/exnode.sysusers
          cp packaging/tmpfiles.d/exnode.conf dist/exnode.tmpfiles
          cp packaging/node.toml dist/node.toml
          # stamp only the two default lines; the script checks they were stamped
          sed -e "/^REPO=/s|@REPO@|$REPO|" -e "/^VERSION=/s|@VERSION@|$TAG|" scripts/install.sh > dist/install.sh
          grep -qx "REPO=\"\${EXNODE_REPO:-$REPO}\"" dist/install.sh
          grep -qx "VERSION=\"\${EXNODE_VERSION:-$TAG}\"" dist/install.sh
          cd dist
          chmod 0755 exnode-*-linux-musl
          sha256sum exnode-x86_64-unknown-linux-musl exnode-aarch64-unknown-linux-musl \
            exnode.service exnode.sysusers exnode.tmpfiles node.toml install.sh > SHA256SUMS
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Sign every file keylessly (one Sigstore bundle each)
        working-directory: dist
        run: |
          for f in *; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Verify the signature as install.sh will
        working-directory: dist
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/exnode-x86_64-unknown-linux-musl
            dist/exnode-aarch64-unknown-linux-musl
            dist/install.sh
            dist/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # create the GitHub Release and upload its assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          Install: download \`install.sh\`, read it, then \`sudo sh install.sh\`. Do not pipe it into a shell.

          Verify by hand (cosign v3):

              cosign verify-blob --bundle SHA256SUMS.sigstore.json \\
                --certificate-identity https://github.com/$REPO/.github/workflows/release.yml@refs/tags/$TAG \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
              sha256sum -c --ignore-missing SHA256SUMS
              gh attestation verify exnode-x86_64-unknown-linux-musl --repo $REPO
          EOF
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --repo "$REPO" --verify-tag --title "exnode $TAG" \
            --notes-file notes.md $prerelease dist/*
