# exnode's directories.  The key lives in the state directory, which only
# exnode can enter; the config is readable by exnode and writable by root only.
#Type Path                      Mode User   Group  Age
d     /var/lib/exnode           0700 exnode exnode -
d     /etc/exnode               0750 root   exnode -
# Put the key back to 0600 at boot if it has drifted (no-op until it exists).
z     /var/lib/exnode/node.key  0600 exnode exnode -
