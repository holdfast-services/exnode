# exnode configuration. Copy to node.toml and fill in your values.
# Every key can be overridden with an EXNODE_ environment variable,
# e.g. EXNODE_HUB_URL=https://hub.example.com

# Hub URL (no trailing slash)
hub_url = "http://127.0.0.1:8000"

# Private key from `exnode init --key-out node.key`. Must be mode 0600.
key_file = "node.key"

# First run only: the one-time enrollment token from the console.
# Prefer passing it as EXNODE_ENROLL_TOKEN=qd_reg_... instead of saving it here.
# enroll_token = ""

# Local inference backend: "ollama" or "openai" (vLLM, llama.cpp llama-server,
# SGLang, or any other OpenAI-compatible server). Must be on this machine.
backend     = "ollama"
backend_url = "http://127.0.0.1:11434"
# Name of an environment variable holding the backend's API key, if it needs one.
# backend_api_key_env = "BACKEND_API_KEY"

# Heartbeat interval (seconds). The console marks a node stale after 45 s.
heartbeat_secs = 15

# Long-poll timeout for job requests (seconds; the hub caps it at 30)
poll_secs = 20

# Maximum concurrent inference jobs
max_concurrency = 2

# ── When, and how much ───────────────────────────────────────────────────────
# `max_concurrency` above is what this machine can run at full capacity. A weekly
# schedule says when it brings that capacity to the exchange and how much of it.
# Rules are read in order and the first that covers a moment decides it. No match
# means off; no rules at all means on, in full, all the time. A window may cross
# midnight, and its morning belongs to the day it started on. Check what you
# wrote, over the next seven days, with `exnode schedule`.
#
# The clock: a zone name (a datacenter server is usually on UTC). Absent: this
# machine's local time.
# timezone = "America/Chicago"
#
# Nights on weekdays in full, weekends at half:
# [[schedule]]
# days  = ["weekdays"]          # mon … sun, weekdays, weekends; absent: every day
# hours = "18:00-08:00"         # 24-hour; or "all day"
# share = 100                   # percent of max_concurrency (rounded up, at least 1)
#
# [[schedule]]
# days  = ["weekends"]
# hours = "all day"
# share = 50
#
# Dates when nothing is served, whatever the schedule says:
# [blackout]
# dates = ["2026-12-24..2027-01-02", "2027-07-04"]
#
# `serve_hours = "18:00-08:00"` is the one-line form: one window, every day, in
# full. Use it or [[schedule]], not both.
#
# Outside its schedule the node keeps heartbeating, and says so: the exchange
# does not count a node that is off duty as supply, and tells a buyer when the
# next window opens. Every limit is yours and is set here, on this machine; the
# exchange is told and never in charge. To stop at once, `exnode pause` (or
# `exnode pause --for 2h`); `exnode resume` ends it. A job already running
# finishes either way.

# Models to advertise and serve. "name" must match the backend's model name.
# "hash" is fetched from Ollama when empty; the openai backend requires it.
# Your trust tier is set by the hub, not here.
#
# "context" is the window, in tokens, each job runs in (default 4096). The hub
# sends a node only jobs whose prompt estimate plus max_tokens fit it. With
# Ollama it is sent as options.num_ctx on every request, so it also sets how
# much memory the model loads with. An OpenAI-compatible server's window is its
# own launch setting (vLLM --max-model-len, llama.cpp --ctx-size per slot):
# advertise no more than that. A job that overflows anyway is refused, never
# truncated, and the hub re-sends it to a node with a larger window.

[[models]]
name    = "qwen3:30b"
context = 32768

# Tool use (function calling).  Add `tools = true` to a model whose engine takes
# OpenAI-style tools and returns the calls the model makes: Ollama with a model
# whose template supports tools, vLLM started with --enable-auto-tool-choice and a
# --tool-call-parser for the model, llama-server started with --jinja.  The hub
# sends tool-use jobs only to nodes that say so, and tests them on it with
# hidden tool prompts, so leave it off unless you have tried it.
#
# [[models]]
# name    = "qwen3:30b"
# context = 32768
# tools   = true

# Example for an OpenAI-compatible server:
# [[models]]
# name    = "Qwen3.8-Flash-Next"
# hash    = "sha256:<digest of the weights you serve>"
# context = 32768
